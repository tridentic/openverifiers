[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openverifiers"
version = "0.2.0.dev0"
description = "A small trusted kernel that checks proofs proposed by untrusted solvers and LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenVerifiers contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The kernel itself is stdlib-only. sympy/z3 back the math pack's hard tier.
dependencies = [
    "lark>=1.1",
    "sympy>=1.12",
    "z3-solver>=4.12",
]

[project.optional-dependencies]
# Pre-M1 code under openverifiers/legacy/ is built on pydantic.
legacy = ["pydantic>=2.0"]
dev = [
    "pydantic>=2.0",
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "coverage>=7.4",
]

[project.scripts]
ov = "openverifiers.cli:main"
ov-m1 = "openverifiers.m1.cli:main"   # the pre-v1 step verifier

[tool.setuptools.packages.find]
where = ["src"]
include = ["openverifiers*"]

[tool.setuptools.package-data]
openverifiers = ["py.typed", "legacy/datasets/*.csv", "m1/benchmarks/cases/*/*.json",
                 "m1/benchmarks/sources/*.py", "m1/benchmarks/results/*",
                 "lang/grammar.lark", "packages/**/*.ov"]

[tool.coverage.run]
source = ["src/openverifiers/raw", "src/openverifiers/kernel", "src/openverifiers/checker",
          "src/openverifiers/state"]

[tool.coverage.report]
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["bench: wall-clock limits; run only in the uninstrumented CI bench job"]
addopts = "-m 'not bench'"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/openverifiers/legacy", "tests/legacy", "openwiki"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/openverifiers", "tests"]
mypy_path = "src"
# Pre-M1 code is not type checked (797 errors under --strict).
exclude = ["src/openverifiers/legacy/", "tests/legacy/", "src/openverifiers/m1/benchmarks/sources/"]
warn_unused_configs = true
check_untyped_defs = true

# The trusted kernel is held to --strict.
[[tool.mypy.overrides]]
module = [
    "openverifiers.raw", "openverifiers.raw.*",
    "openverifiers.kernel", "openverifiers.kernel.*",
    "openverifiers.checker", "openverifiers.checker.*",
    "openverifiers.objects", "openverifiers.objects.*",
    "openverifiers.bench", "openverifiers.bench.*",
    "openverifiers.m1.kernel", "openverifiers.m1.kernel.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["sympy", "z3"]
ignore_missing_imports = true
