# The Masterbook docs job (documentation only). Builds the book on every push to
# docs/masterbook and uploads the PDF. It fails on an unfilled placeholder, a
# failing or changed example (snapshot mismatch), a status badge without an
# evidence marker, a citation to a missing file, line range, test or commit, and
# missing reproduce.sh numbers for the code commit. It does not rerun the
# ~11-minute reproduce.sh: it uses the outputs committed in
# docs/masterbook/repro/<code-commit>/ (--ci refuses to create them).
name: masterbook

on:
  push:
    branches: [docs/masterbook]
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (Graphviz, pdfinfo)
        run: sudo apt-get update && sudo apt-get install -y graphviz poppler-utils
      - name: Install (dev + docs extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
      - name: Build the book (fails on placeholders, failing examples, missing evidence)
        run: python scripts/build_masterbook.py --ci
      - name: Upload the PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openverifiers-masterbook
          path: |
            docs/masterbook/build/OpenVerifiers_Masterbook_*.pdf
            docs/masterbook/build/stats.json
          if-no-files-found: warn
