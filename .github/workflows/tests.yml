name: tests

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Trusted-code size gate
        run: python scripts/tcb_size.py
      - name: Tests with coverage gate (raw, kernel, checker >= 95%)
        run: |
          python -m coverage run -m pytest -q tests/v1
          python -m coverage report
      - name: Full test suite (v1 + m1 + legacy)
        run: python -m pytest -q

  # Wall-clock limits, uninstrumented (no coverage). Deselected everywhere else.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Timing limits (10k facts < 5 s, q11 < 1 s, ov check p95 < 300 ms)
        run: python -m pytest -q -m bench
