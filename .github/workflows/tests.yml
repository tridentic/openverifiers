name: tests

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Trusted-code size gate
        run: python scripts/tcb_size.py
      - name: Tests with coverage gate (raw, kernel, checker >= 95%)
        run: |
          python -m coverage run -m pytest -q tests/v1
          python -m coverage report
      - name: Full test suite (v1 + m1 + legacy)
        run: python -m pytest -q

  # Wall-clock limits, uninstrumented (no coverage). Deselected everywhere else.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Timing limits (10k facts < 5 s, q11 < 1 s, ov check p95 < 300 ms)
        run: python -m pytest -q -m bench

  # Gold may only change with a human's approval trailer; new benchmark gold must be
  # committed alone, before results. See src/openverifiers/bench/gold_gate.py.
  gold-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gold-diff gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          PYTHONPATH=src python -m openverifiers.bench.gold_gate "$BASE" HEAD
